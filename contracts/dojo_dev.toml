[namespace]
default = "zidle"

[env]
rpc_url = "http://localhost:5050"
account_address = "0x6daf2a924fab727ae5409f0743de4869850f988b6f8545268016ad1107fd2cd"
private_key = "0x1e5c62853e3189afdfdfcfb2d8ab0a1c372907db6eb1d1e5bf8ff438420adb3"

[init_call_args]
"zidle-character_minter" = [
  "0x033f05797f8d389757d061f04ba4be429e5143b5fc2e2dc4c77bdb7e517e706f", # CHARACTER_ERC721_TOKEN_ADDRESS 
  "10000",  # max supply (low)
  "0",      # max supply (high)
  "100",    # max per wallet (low)
  "0",      # max per wallet (high)
  "1",      # is_open
]
"zidle-gold_minter" = [
  "0x041a8602ddf005594d1a6149325eaa21a103216a15c2883188ee912ed9a59cb0", # GOLD_ERC20_TOKEN_ADDRESS
  "1000000000000000",  # max supply (low)
  "0",                 # max supply (high)
  "1000000000000000",  # max per wallet (low)
  "0",                 # max per wallet (high)
  "1",                 # is_open
]
"zidle-settings" = [
  "0x6daf2a924fab727ae5409f0743de4869850f988b6f8545268016ad1107fd2cd",  # admin address
  "0x033f05797f8d389757d061f04ba4be429e5143b5fc2e2dc4c77bdb7e517e706f", # CHARACTER_ERC721_TOKEN_ADDRESS 
  "0x041a8602ddf005594d1a6149325eaa21a103216a15c2883188ee912ed9a59cb0", # GOLD_ERC20_TOKEN_ADDRESS
]

[writers]
"zidle-TokenConfig" = ["zidle-character_minter", "zidle-gold_minter"]
"zidle-Miner" = ["zidle-character"]
"zidle-Player" = ["zidle-character"]
"zidle-Char" = ["zidle-resources"]
"zidle-Admin" = ["zidle-settings"]
"zidle-Settings" = ["zidle-settings"]